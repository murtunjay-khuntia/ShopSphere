services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopsphere-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
    ports:
      - "14333:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/ShopSphere
      dockerfile: Dockerfile
    container_name: shopsphere-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ShopSphereDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"
      JwtSettings__SecretKey: "ShopSphere_Super_Secret_Docker_Key_2026_Min32Chars!"
      JwtSettings__Issuer: "ShopSphereAPI"
      JwtSettings__Audience: "ShopSphereClient"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: shopsphere-web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  sql_data:
