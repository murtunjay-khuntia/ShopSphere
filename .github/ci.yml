name: ShopSphere CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: .NET 8 Build & 32 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/ShopSphere/ShopSphere.slnx

      - name: Build Solution
        run: dotnet build backend/ShopSphere/ShopSphere.slnx --configuration Release --no-restore

      - name: Run xUnit Tests
        run: dotnet test backend/ShopSphere/ShopSphere.UnitTests/ShopSphere.UnitTests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: React TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
